# Arboria.app's Rust side (ADR 0004): its own workspace and Cargo.lock, so the core's CI
# needs no webkit. Exact versions, each published at least two weeks before 2026-11-05;
# transitive versions are held to the same rule in Cargo.lock (scripts/check_crate_dates.py).
[workspace]

[package]
name = "arboria-app"
description = "Arboria.app: the window over the Rust core."
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "MIT"
publish = false

[lib]
name = "arboria_app"
crate-type = ["rlib"]

[[bin]]
name = "arboria"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
arboria-core = { path = "../../crates/arboria-core" }
portable-pty = "=0.9.0"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip", "preserve_order"] }
tauri = { version = "=2.12.5", features = [] }
# the native “choose a folder” dialog (used from Rust only: no JS permission)
tauri-plugin-dialog = "=2.8.3"

[profile.release]
codegen-units = 1
lto = true
strip = true

# Never built (wasm32 only): they hold tauri's wasm-side transitive dependencies to
# releases at least two weeks old, which move together (exact pins between them).
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "=0.3.106"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
web-sys = "=0.3.106"
