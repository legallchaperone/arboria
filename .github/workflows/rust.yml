name: rust

on:
  push:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - "tests/vectors/**"
      # the committed Python snapshots the Rust tests compare against
      - "src/arboria/cli.py"
      - "src/arboria/db.py"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - "tests/vectors/**"
      # the committed Python snapshots the Rust tests compare against
      - "src/arboria/cli.py"
      - "src/arboria/db.py"
      - ".github/workflows/rust.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  cargo:
    name: cargo (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v6

      - name: Toolchain (pinned in rust-toolchain.toml)
        run: rustup toolchain install && rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  python-snapshots:
    # crates/arb/tests/python_commands.txt and crates/arboria-core/tests/fixtures/ are
    # generated from the Python CLI and ledger; fail when they are stale.
    name: Python snapshots are current
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install the project
        run: uv sync --locked

      - name: Regenerate
        run: |
          uv run --locked python crates/arb/tests/gen_python_commands.py
          uv run --locked python crates/arboria-core/tests/fixtures/gen_fixtures.py

      - name: Unchanged
        run: git diff --exit-code -- crates/
