name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        # setup-uv no longer moves major tags (the last one is v7); pin a release.
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install the project, the ui extra (marimo) and dev dependencies
        run: uv sync --locked --all-extras --dev

      - name: Git identity (the tests make commits in temporary repositories)
        run: |
          git config --global user.name "arboria CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main

      - name: Run the tests
        run: uv run --locked pytest -q
