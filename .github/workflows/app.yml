name: app

# Arboria.app (ADR 0004): the React pages and the Tauri crate (its own Cargo workspace).
on:
  push:
    paths:
      - "app/**"
      - "crates/arboria-core/**"
      - "crates/arboria-macos/**"
      - "src/arboria/ui/fonts/**"
      - "rust-toolchain.toml"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "app/**"
      - "crates/arboria-core/**"
      - "crates/arboria-macos/**"
      - "src/arboria/ui/fonts/**"
      - "rust-toolchain.toml"
      - ".github/workflows/app.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  app:
    name: app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6

      - name: webkit2gtk (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Pages
        run: |
          npm ci
          npm run check
          npm test
          npx vite build

      - name: Toolchain (pinned in rust-toolchain.toml)
        run: rustup toolchain install && rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Format
        working-directory: app/src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: app/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        working-directory: app/src-tauri
        run: cargo test --locked

      - name: Build (the bundled pages, as tauri build does)
        working-directory: app/src-tauri
        run: cargo build --locked --features tauri/custom-protocol

      # ---- macOS acceptance (ADR 0004): what can run without a person at the machine

      - name: Bundle Arboria.app (unsigned)
        if: runner.os == 'macOS'
        run: npx tauri build --bundles app --ci

      - name: Upload Arboria.app
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Arboria.app
          path: app/src-tauri/target/release/bundle/macos/

      - name: Touch ID query, a real notification, the LaunchAgent helper
        if: runner.os == 'macOS'
        working-directory: .
        env:
          ARBORIA_TEST_NOTIFY: "1"
          ARBORIA_TEST_TOUCH_ID: "1"
        run: |
          set -euo pipefail
          cargo test --locked -p arboria-macos -- --nocapture
          # the app's signing path up to the system prompt; nobody answers: nothing approved
          cargo test --locked -p arboria-core --lib touch_id_unanswered -- --nocapture
          cargo test --locked -p arboria-core --lib notifier -- --nocapture
          cargo install --locked --path crates/arb --root "$RUNNER_TEMP/arb"
          export PATH="$RUNNER_TEMP/arb/bin:$PATH"
          export ARBORIA_CACHE_DIR="$RUNNER_TEMP/cache" ARBORIA_CONFIG_DIR="$RUNNER_TEMP/cfg" ARBORIA_HOME="$RUNNER_TEMP/home"
          arb helper install
          for i in $(seq 45); do grep -q '"last_tick": "' "$ARBORIA_CACHE_DIR/helper.json" 2>/dev/null && break; sleep 2; done
          launchctl print "gui/$(id -u)/world.cwx.arboria.helper" | grep -E "state =|program ="
          arb helper status
          grep '"last_tick": "' "$ARBORIA_CACHE_DIR/helper.json"
          arb helper uninstall
          ! launchctl print "gui/$(id -u)/world.cwx.arboria.helper" 2>/dev/null

      - name: Start the bundled app and take a screenshot
        if: runner.os == 'macOS'
        continue-on-error: true
        working-directory: .
        run: |
          open app/src-tauri/target/release/bundle/macos/Arboria.app
          sleep 10
          pgrep -fl "Arboria.app/Contents/MacOS" 
          screencapture -x "$RUNNER_TEMP/app.png"
          osascript -e 'tell application "Arboria" to quit' || true
          # the screenshot in the log too (base64 PNG, small), for reading it without the artifact
          sips -Z 1280 "$RUNNER_TEMP/app.png" --out "$RUNNER_TEMP/small.png" >/dev/null
          echo "SCREENSHOT-BEGIN"; base64 -i "$RUNNER_TEMP/small.png" | fold -w 76; echo "SCREENSHOT-END"

      - name: A notification banner on screen
        if: runner.os == 'macOS'
        continue-on-error: true
        working-directory: .
        env:
          ARBORIA_TEST_NOTIFY: "1"
        run: |
          # through Arboria.app (UserNotifications, as the app): the bundle's signature (an
          # ad-hoc one, bound to Info.plist), its permission state, then one notification,
          # run directly (as the helper does) and through LaunchServices; screenshots (the
          # banner, or the system's "Arboria would like to send notifications" prompt)
          bundle="$PWD/app/src-tauri/target/release/bundle/macos/Arboria.app"
          app="$bundle/Contents/MacOS/arboria"
          codesign -dv "$bundle" 2>&1 | grep -E "Identifier|Signature|Info.plist|Sealed" || true
          "$app" --notify-status
          ( "$app" --notify "Arboria" "CI: r001 跑完了（直接运行）"; echo "direct: exit $?" ) &
          python3 -c "import time; time.sleep(4)"
          screencapture -x "$RUNNER_TEMP/notify-1.png"
          open -n -g -a "$bundle" --args --notify "Arboria" "CI: r002 跑完了（open -a）"
          python3 -c "import time; time.sleep(5)"
          screencapture -x "$RUNNER_TEMP/notify-2.png"
          "$app" --notify-status
          log show --last 40s --style compact --predicate 'process == "usernoted"' \
            | grep -iE "arboria|authoriz|permission|not allowed" | head -20 || true
          db="$HOME/Library/Group Containers/group.com.apple.usernoted/db2/db"
          sqlite3 "$db" "select a.identifier, r.presented from record r join app a on a.app_id = r.app_id order by r.rec_id desc limit 3;" 2>&1 || true
          for t in 1 2; do
            sips -Z 900 "$RUNNER_TEMP/notify-$t.png" --out "$RUNNER_TEMP/n-$t.png" >/dev/null
            echo "NOTIFY-$t-BEGIN"; base64 -i "$RUNNER_TEMP/n-$t.png" | fold -w 76; echo "NOTIFY-$t-END"
          done
          pkill -f "Arboria.app/Contents/MacOS/arboria" || true

      - name: Upload the screenshot
        if: runner.os == 'macOS'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: macos-screenshot
          path: ${{ runner.temp }}/app.png
