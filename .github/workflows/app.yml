name: app

# Arboria.app (ADR 0004): the React pages and the Tauri crate (its own Cargo workspace).
on:
  push:
    paths:
      - "app/**"
      - "crates/arboria-core/**"
      - "crates/arboria-macos/**"
      - "src/arboria/ui/fonts/**"
      - "rust-toolchain.toml"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "app/**"
      - "crates/arboria-core/**"
      - "crates/arboria-macos/**"
      - "src/arboria/ui/fonts/**"
      - "rust-toolchain.toml"
      - ".github/workflows/app.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  app:
    name: app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6

      - name: webkit2gtk (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Pages
        run: |
          npm ci
          npm run check
          npm test
          npx vite build

      - name: Toolchain (pinned in rust-toolchain.toml)
        run: rustup toolchain install && rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Format
        working-directory: app/src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: app/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        working-directory: app/src-tauri
        run: cargo test --locked

      - name: Build (the bundled pages, as tauri build does)
        working-directory: app/src-tauri
        run: cargo build --locked --features tauri/custom-protocol
