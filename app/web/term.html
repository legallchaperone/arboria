<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<link rel="stylesheet" href="xterm.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="bundle.css">
<style>
  html, body { height: 100%; overflow: hidden; background: var(--bg-subtle); }
  header { display: flex; align-items: center; gap: var(--col-1); height: var(--size-row); padding: 0 var(--col-2); color: var(--ink-muted); }
  .tabs { display: flex; gap: 2px; }
  .tab { font: inherit; border: 0; background: none; color: var(--ink-muted); padding: 0 var(--col-1); border-radius: var(--radius-sm); cursor: default; }
  .tab:hover { background: var(--fill); }
  .tab.is-on { color: var(--ink); background: var(--fill); }
  #t { position: absolute; inset: var(--size-row) var(--col-1) var(--space-2) var(--col-2); }
  .xterm .xterm-viewport { background: transparent !important; }
  .xterm .xterm-viewport::-webkit-scrollbar { width: 6px; }
  .xterm .xterm-viewport::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
  .xterm .xterm-viewport::-webkit-scrollbar-track { background: transparent; }
</style></head>
<body class="body">
<header><nav class="tabs" aria-label="agent 面板"><button class="tab" id="to-agent" aria-pressed="false">对话</button><button class="tab is-on" aria-pressed="true">终端</button></nav><span id="idea" class="ab-clip"></span><span class="ab-spacer"></span><span class="small">⌘J 收起</span></header>
<div id="t"></div>
<script src="xterm.js"></script>
<script src="addon-fit.js"></script>
<script>
  const post = (m) => window.webkit.messageHandlers.term.postMessage(m);
  window.b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  window.ended = () => term.write("\r\n\x1b[2m[agent 已退出]\x1b[0m\r\n");
  document.getElementById("to-agent").addEventListener("click", () => post({ kind: "tab", tab: "agent" }));
  window.setIdea = (name) => { document.getElementById("idea").textContent = name; };
  // xterm's colours come from the design tokens and follow the system appearance.
  function theme() {
    const v = (n) => getComputedStyle(document.documentElement).getPropertyValue("--" + n).trim();
    return {
      background: v("bg-subtle"), foreground: v("ink"), cursor: v("accent"), cursorAccent: v("bg-subtle"),
      selectionBackground: v("accent-fill-hover"),
      black: v("ink-faint"), red: v("bad"), green: v("ok"), yellow: v("warn"), blue: v("accent-text"),
      magenta: v("series-6"), cyan: v("series-4"), white: v("ink-muted"),
      brightBlack: v("ink-muted"), brightRed: v("bad"), brightGreen: v("ok"), brightYellow: v("warn"),
      brightBlue: v("accent"), brightMagenta: v("series-6"), brightCyan: v("series-4"), brightWhite: v("ink"),
    };
  }
  document.fonts.load('14px "Maple Mono CN"').finally(() => {
    window.term = new Terminal({ fontFamily: '"Maple Mono CN", monospace', fontSize: 13, lineHeight: 1.15,
      cursorBlink: true, theme: theme() });
    const fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    term.open(document.getElementById("t"));
    fit.fit();
    term.onData((d) => post({ kind: "data", data: d }));
    term.onResize(({ cols, rows }) => post({ kind: "resize", cols, rows }));
    new ResizeObserver(() => fit.fit()).observe(document.getElementById("t"));
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { term.options.theme = theme(); });
    window.fitNow = () => { fit.fit(); post({ kind: "resize", cols: term.cols, rows: term.rows }); };
    window.screenText = () => { const b = term.buffer.active, out = [];
      for (let i = 0; i < b.length; i++) { const l = b.getLine(i)?.translateToString(true); if (l && l.trim()) out.push(l); }
      return out.join("\n"); };
    post({ kind: "ready", cols: term.cols, rows: term.rows });
  });
</script></body></html>
