<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="bundle.css">
<link rel="stylesheet" href="app.css">
</head>
<body class="body">
<header id="bar" class="ab-titlebar" role="toolbar" aria-label="标题栏" data-drag>
  <button id="crumb" class="ab-crumb ab-btn body" title="换 idea ⌘P">
    <span class="up" id="crumb-project"></span><span class="sep" id="crumb-sep" hidden>›</span><span class="strong" id="crumb-idea"></span>
    <svg class="ab-glyph" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 6.5L8 10l3.5-3.5"/></svg>
  </button>
  <span class="ab-spacer" data-drag></span>
  <button id="needs" class="tool body" hidden title="待你处理 ⌘0">待你处理 <span class="n" id="needs-n"></span></button>
  <button id="agent" class="tool body" title="agent ⌘J"><span class="small">⌘J</span> <span class="lbl">agent</span></button>
</header>

<main id="home" hidden><div class="home">
  <section>
    <h2 class="title">待你处理</h2>
    <div id="inbox" class="ab-inbox"></div>
  </section>
  <section>
    <h2 class="heading">idea</h2>
    <div id="ideas" class="ab-list"></div>
  </section>
  <section id="todos-section" hidden>
    <h2 class="heading">等 agent</h2>
    <div id="todos" class="ab-list"></div>
  </section>
</div></main>

<div id="overlay" hidden>
  <div class="ab-palette" role="dialog" aria-label="换 idea">
    <div class="ab-palette-input body">
      <svg class="ab-glyph ab-muted" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.5 4.5L10 8l-3.5 3.5"/></svg>
      <input id="q" class="body" placeholder="换到哪个 idea" autocomplete="off" spellcheck="false"
             role="combobox" aria-controls="plist" aria-expanded="true">
    </div>
    <div id="plist" class="ab-palette-list ab-list" role="listbox"></div>
    <div class="ab-palette-foot small"><span>↑↓ 选择</span><span>⏎ 打开</span><span>esc 关闭</span></div>
  </div>
</div>
<script src="app.js"></script>
</body></html>
